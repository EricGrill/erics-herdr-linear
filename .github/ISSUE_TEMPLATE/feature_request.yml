name: Idea or feature request
description: Suggest something the layout should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the moment this would help, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like it to do?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you handle it today?
      description: Any workaround, even an annoying one.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I've checked this belongs to the layout, not to Herdr or Linear themselves
